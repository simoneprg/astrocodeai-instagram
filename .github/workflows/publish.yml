name: Instagram publish

on:
  schedule:
    - cron: "7 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      only_id:
        description: "Publish only this queue id now (ignores publish_at)"
        required: false
      dry_run:
        description: "1 = list what would be published, publish nothing"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-dejavu-core ffmpeg >/dev/null
          pip install -q pillow
      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          ONLY_ID: ${{ github.event.inputs.only_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          git config user.name "astrocodice-bot"
          git config user.email "actions@users.noreply.github.com"
          python instagram/publish.py
      - name: Save publish log
        if: always()
        run: |
          git add instagram/published.json || true
          git diff --cached --quiet || (git commit -m "instagram: publish log [skip ci]" && git pull --rebase && git push)
