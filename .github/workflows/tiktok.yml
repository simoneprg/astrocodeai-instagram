name: TikTok publish
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      only_id:
        description: "Publish only this post id (optional)"
        required: false
      dry_run:
        description: "1 = build the video without posting"
        required: false
        default: "0"
permissions:
  contents: write
concurrency:
  group: tiktok
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-dejavu-core ffmpeg >/dev/null
          pip install -q pillow
          git config user.name "astrocodeai-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Publish
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          TIKTOK_MARKETS: ${{ vars.TIKTOK_MARKETS }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          ONLY_ID: ${{ inputs.only_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 tiktok/publish_tiktok.py
